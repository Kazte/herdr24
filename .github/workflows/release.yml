name: Release installer
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact source and embedded runtime assets
        run: |
          npm test
          go test -race ./...
          sh -n install.sh scripts/build-release.sh
          git diff --exit-code
      - name: Build versioned platform installers and checksums
        env:
          VERSION: ${{ github.ref_name }}
        run: sh scripts/build-release.sh "$VERSION" dist
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: gh release create "$VERSION" dist/* --verify-tag --title "herdr24 $VERSION" --generate-notes
